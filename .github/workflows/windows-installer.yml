name: Build Windows Installer (ScadaT4bun Lokal)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build package
        shell: pwsh
        run: ./local/build_windows.ps1
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Compile installer
        run: iscc local\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: ScadaT4bun-Setup
          path: local/Output/*.exe
